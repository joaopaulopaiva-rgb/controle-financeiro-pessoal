<!doctype html>
<title>Extrato Vivo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --bg:#f5f5f2;
    --surface:#ffffff;
    --surface-2:#ececE6;
    --text:#1c1d1f;
    --text-muted:#6b6d72;
    --border:#e1e0da;
    --accent:#4a4fc4;
    --accent-ink:#ffffff;
    --positive:#25824a;
    --negative:#c8402f;
    --shadow: 0 1px 2px rgba(20,20,30,.04), 0 6px 16px rgba(20,20,30,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#131417;
      --surface:#1c1e22;
      --surface-2:#25282d;
      --text:#eceef0;
      --text-muted:#9a9ea5;
      --border:#2b2e33;
      --accent:#8c92f0;
      --accent-ink:#14151a;
      --positive:#4fce85;
      --negative:#f2897b;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#131417;
    --surface:#1c1e22;
    --surface-2:#25282d;
    --text:#eceef0;
    --text-muted:#9a9ea5;
    --border:#2b2e33;
    --accent:#8c92f0;
    --accent-ink:#14151a;
    --positive:#4fce85;
    --negative:#f2897b;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"IBM Plex Sans", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center;
  }
  .num{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; }

  .shell{ width:100%; max-width:480px; min-height:100dvh; display:flex; flex-direction:column; }

  header.top{
    position:sticky; top:0; z-index:5;
    background:var(--bg); padding:18px 18px 10px;
    border-bottom:1px solid var(--border);
  }
  .brand{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .brand h1{ font-size:18px; margin:0; font-weight:700; letter-spacing:-.01em; }
  .brand .saldo-tag{ font-size:13px; color:var(--text-muted); }
  .brand .saldo-tag b.num{ color:var(--text); font-weight:600; }

  nav.tabs{ display:flex; gap:4px; margin-top:14px; background:var(--surface-2); border-radius:10px; padding:3px; }
  nav.tabs button{
    flex:1; border:0; background:transparent; padding:9px 0; border-radius:8px;
    font:inherit; font-weight:600; font-size:13.5px; color:var(--text-muted); cursor:pointer;
  }
  nav.tabs button.active{ background:var(--surface); color:var(--text); box-shadow:var(--shadow); }

  main{ flex:1; padding:16px 18px 40px; display:flex; flex-direction:column; gap:22px; }
  section{ display:none; flex-direction:column; gap:20px; }
  section.active{ display:flex; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; box-shadow:var(--shadow); }

  /* --- Lançar --- */
  form#entry{ display:flex; flex-direction:column; gap:14px; }

  .type-toggle{ display:flex; gap:8px; }
  .type-toggle button{
    flex:1; padding:10px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface);
    font:inherit; font-weight:600; font-size:14px; color:var(--text-muted); cursor:pointer;
  }
  .type-toggle button[data-type="despesa"].active{ border-color:var(--negative); color:var(--negative); background:color-mix(in srgb, var(--negative) 10%, var(--surface)); }
  .type-toggle button[data-type="receita"].active{ border-color:var(--positive); color:var(--positive); background:color-mix(in srgb, var(--positive) 10%, var(--surface)); }

  .amount-row{ display:flex; align-items:baseline; gap:6px; justify-content:center; padding:6px 0 2px; }
  .amount-row span{ font-size:22px; color:var(--text-muted); font-family:"IBM Plex Mono",monospace; }
  input#valor{
    border:0; background:transparent; font-family:"IBM Plex Mono",monospace; font-size:40px; font-weight:600;
    color:var(--text); width:220px; text-align:left; outline:none;
  }
  input#valor::placeholder{ color:var(--text-muted); opacity:.5; }

  label.field{ display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
  .chips{ display:flex; flex-wrap:wrap; gap:7px; }
  .chip{
    border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    padding:7px 12px; border-radius:999px; font:inherit; font-size:13.5px; font-weight:500; cursor:pointer;
  }
  .chip.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .chip.add{ color:var(--text-muted); border-style:dashed; }

  select, input[type="date"], input[type="text"]{
    width:100%; border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    border-radius:9px; padding:10px 11px; font:inherit; font-size:14.5px; outline:none;
  }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  button.primary{
    border:0; background:var(--accent); color:var(--accent-ink); font:inherit; font-weight:700; font-size:15px;
    padding:13px; border-radius:11px; cursor:pointer; margin-top:2px;
  }
  button.primary:disabled{ opacity:.5; }
  .hint{ font-size:12px; color:var(--text-muted); text-align:center; }

  .list-title{ font-size:13px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em; margin: 4px 2px -8px; }
  .day-group{ display:flex; flex-direction:column; gap:8px; }
  .day-label{ font-size:12px; color:var(--text-muted); font-weight:600; margin:10px 2px 0; }
  .txn{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:11px 12px; }
  .txn .cat-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .txn .cat-dot.despesa{ background:var(--negative); }
  .txn .cat-dot.receita{ background:var(--positive); }
  .txn .info{ flex:1; min-width:0; }
  .txn .desc{ font-size:14.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .txn .meta{ font-size:12px; color:var(--text-muted); }
  .txn .amt{ font-size:15px; font-weight:600; white-space:nowrap; }
  .txn .amt.despesa{ color:var(--negative); }
  .txn .amt.receita{ color:var(--positive); }
  .txn .del{ border:0; background:transparent; color:var(--text-muted); font-size:16px; cursor:pointer; padding:2px 4px; line-height:1; }
  .empty{ text-align:center; color:var(--text-muted); font-size:13.5px; padding:24px 10px; }

  /* --- Resumo --- */
  .month-select{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch; }
  .month-chip{
    flex:0 0 auto; border:1px solid var(--border); background:var(--surface); color:var(--text-muted);
    padding:8px 14px; border-radius:999px; font:inherit; font-weight:600; font-size:13.5px; cursor:pointer; white-space:nowrap;
  }
  .month-chip.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }

  .stat-row{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .stat{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 10px; text-align:center; box-shadow:var(--shadow); }
  .stat .k{ font-size:11px; color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
  .stat .v{ font-size:15.5px; font-weight:700; margin-top:4px; }
  .stat.saldo .v{ color:var(--accent); }
  .stat.receitas .v{ color:var(--positive); }
  .stat.despesas .v{ color:var(--negative); }

  .barlist{ display:flex; flex-direction:column; gap:10px; }
  .barrow .top{ display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:5px; }
  .barrow .top .cat{ font-weight:600; }
  .barrow .top .val{ color:var(--text-muted); }
  .bartrack{ height:7px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
  .barfill{ height:100%; background:var(--accent); border-radius:99px; }

  .analise{ border:1px solid var(--border); border-radius:12px; padding:13px; background:var(--surface); }
  .analise .head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .analise .head b{ font-size:14px; }
  .analise .head span{ font-size:11.5px; color:var(--text-muted); }
  .analise ul{ margin:6px 0 0; padding-left:18px; font-size:13px; line-height:1.5; }
  .analise .divergencia{ color:var(--negative); }

  .offline-banner{ background:var(--surface-2); border:1px dashed var(--border); border-radius:10px; padding:10px 12px; font-size:12.5px; color:var(--text-muted); text-align:center; }
</style>

<div class="shell">
  <header class="top">
    <div class="brand">
      <h1>Extrato Vivo</h1>
      <span class="saldo-tag">saldo do mês <b class="num" id="saldoMesTag">R$ 0,00</b></span>
    </div>
    <nav class="tabs">
      <button data-tab="lancar" class="active">Lançar</button>
      <button data-tab="resumo">Resumo</button>
    </nav>
  </header>

  <main>
    <div id="offlineBanner" class="offline-banner" style="display:none;">
      Não consegui conectar ao banco de dados do app agora — abra este link a partir da conversa no Claude para lançar e ver seus dados.
    </div>
    <div id="syncBanner" class="offline-banner" style="display:none;"></div>

    <section id="tab-lancar" class="active">
      <form id="entry" class="card">
        <div class="type-toggle">
          <button type="button" data-type="despesa" class="active">Despesa</button>
          <button type="button" data-type="receita">Receita</button>
        </div>

        <div class="amount-row">
          <span>R$</span>
          <input id="valor" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0,00" required>
        </div>

        <label class="field">Categoria
          <div class="chips" id="catChips"></div>
        </label>

        <label class="field" id="subField" style="display:none;">Subcategoria
          <div class="chips" id="subChips"></div>
        </label>

        <div class="grid2">
          <label class="field">Método
            <select id="metodo">
              <option value="pix">Pix</option>
              <option value="credito">Cartão de crédito</option>
              <option value="debito">Cartão de débito</option>
              <option value="dinheiro">Dinheiro</option>
              <option value="transferencia">Transferência</option>
            </select>
          </label>
          <label class="field">Data
            <input id="data" type="date">
          </label>
        </div>

        <label class="field">Descrição (opcional)
          <input id="descricao" type="text" placeholder="ex.: mercado, uber, aluguel">
        </label>

        <button class="primary" id="btnSalvar" type="submit">Salvar lançamento</button>
      </form>

      <div>
        <div class="list-title">Lançamentos recentes</div>
        <div id="listaRecentes"></div>
      </div>
    </section>

    <section id="tab-resumo">
      <div class="month-select" id="mesSelect"></div>

      <div class="stat-row">
        <div class="stat receitas"><div class="k">Receitas</div><div class="v num" id="statReceitas">R$ 0</div></div>
        <div class="stat despesas"><div class="k">Despesas</div><div class="v num" id="statDespesas">R$ 0</div></div>
        <div class="stat saldo"><div class="k">Saldo</div><div class="v num" id="statSaldo">R$ 0</div></div>
      </div>

      <div class="card">
        <div class="list-title" style="margin-top:0;">Gasto por categoria</div>
        <div class="barlist" id="barlist"></div>
      </div>

      <div>
        <div class="list-title">Análises mensais</div>
        <div id="analisesLista" style="display:flex; flex-direction:column; gap:10px;"></div>
      </div>
    </section>
  </main>
</div>

<script>
(function(){
  "use strict";

  var DEFAULT_CATEGORIAS = {
    despesa: {
      "Alimentação": ["Supermercado","Restaurante/Delivery","Padaria","Cafeteria","Doces/Salgados","Bebidas"],
      "Transporte": ["Uber/Corridas","Combustível","Estacionamento","Carro/Manutenção"],
      "Saúde": ["Plano odontológico","Academia","Farmácia","Médico/Especialista","Atividade física"],
      "Educação": ["Inglês","Reforço escolar","Escola/Creche","Lanches","Material escolar","Curso/Plataforma"],
      "Cuidados pessoais": ["Cabelo","Estética/Unha","Óptica","Perfumaria"],
      "Compras": ["Roupas/Calçados","Móveis/Decoração","Joias","Eletrônicos","Marketplace/Geral","Loja de departamento","Casa/Eletro","Esporte","Diversos"],
      "Lazer": ["Passeios/Parques","Eventos","Colecionáveis","Jogos","Passeio"],
      "Assinaturas": ["Streaming","Jogos","Produtividade","Fidelidade"],
      "Moradia": ["Água","Internet/TV","Energia","Condomínio","Aluguel"],
      "Outros": ["Não identificado"]
    },
    receita: ["Salário","Freelance/Extra","Reembolso","Rendimento","Outros"]
  };
  var METODO_LABEL = {pix:"Pix", credito:"Cartão de crédito", debito:"Cartão de débito", dinheiro:"Dinheiro", transferencia:"Transferência"};

  var state = {
    db: null,
    categorias: JSON.parse(JSON.stringify(DEFAULT_CATEGORIAS)),
    tipo: "despesa",
    categoriaSelecionada: null,
    subcategoriaSelecionada: null,
    transacoes: [],
    resumos: [],
    mesAtual: isoMonth(new Date())
  };

  var $ = function(sel, root){ return (root||document).querySelector(sel); };
  var $all = function(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); };

  function isoDate(d){ return d.toISOString().slice(0,10); }
  function isoMonth(d){ return d.toISOString().slice(0,7); }
  function fmtBRL(n){ return (n||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'}); }
  function monthLabelShort(ym){
    var parts = ym.split("-");
    var d = new Date(Number(parts[0]), Number(parts[1])-1, 1);
    var s = d.toLocaleDateString('pt-BR', {month:'short', year:'2-digit'}).replace('.', '');
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  // ---- Tabs ----
  $all('nav.tabs button').forEach(function(btn){
    btn.addEventListener('click', function(){
      $all('nav.tabs button').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      $all('main > section').forEach(function(s){ s.classList.remove('active'); });
      $('#tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  // ---- Entry form: type toggle ----
  $all('.type-toggle button').forEach(function(btn){
    btn.addEventListener('click', function(){
      $all('.type-toggle button').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      state.tipo = btn.dataset.type;
      state.categoriaSelecionada = null;
      state.subcategoriaSelecionada = null;
      renderChips();
    });
  });

  function categoriasDoTipo(){
    return state.tipo === 'despesa' ? Object.keys(state.categorias.despesa) : state.categorias.receita;
  }

  function renderChips(){
    var wrap = $('#catChips');
    wrap.innerHTML = "";
    var lista = categoriasDoTipo();
    lista.forEach(function(cat){
      var chip = document.createElement('button');
      chip.type = "button";
      chip.className = "chip" + (state.categoriaSelecionada === cat ? " active" : "");
      chip.textContent = cat;
      chip.addEventListener('click', function(){
        state.categoriaSelecionada = cat;
        state.subcategoriaSelecionada = null;
        renderChips();
        renderSubChips();
      });
      wrap.appendChild(chip);
    });
    var addChip = document.createElement('button');
    addChip.type = "button";
    addChip.className = "chip add";
    addChip.textContent = "+ nova";
    addChip.addEventListener('click', function(){
      var nova = prompt("Nome da nova categoria de " + (state.tipo === 'despesa' ? 'despesa' : 'receita') + ":");
      nova = (nova||"").trim();
      if(!nova) return;
      if(state.tipo === 'despesa'){
        if(!state.categorias.despesa[nova]) state.categorias.despesa[nova] = [];
      } else if(lista.indexOf(nova) === -1){
        lista.push(nova);
      }
      salvarCategorias();
      state.categoriaSelecionada = nova;
      state.subcategoriaSelecionada = null;
      renderChips();
      renderSubChips();
    });
    wrap.appendChild(addChip);
    renderSubChips();
  }

  function renderSubChips(){
    var field = $('#subField');
    var wrap = $('#subChips');
    if(state.tipo !== 'despesa' || !state.categoriaSelecionada){
      field.style.display = "none";
      return;
    }
    field.style.display = "flex";
    wrap.innerHTML = "";
    var lista = state.categorias.despesa[state.categoriaSelecionada] || [];
    lista.forEach(function(sub){
      var chip = document.createElement('button');
      chip.type = "button";
      chip.className = "chip" + (state.subcategoriaSelecionada === sub ? " active" : "");
      chip.textContent = sub;
      chip.addEventListener('click', function(){
        state.subcategoriaSelecionada = sub;
        renderSubChips();
      });
      wrap.appendChild(chip);
    });
    var addChip = document.createElement('button');
    addChip.type = "button";
    addChip.className = "chip add";
    addChip.textContent = "+ nova";
    addChip.addEventListener('click', function(){
      var nova = prompt("Nome da nova subcategoria de " + state.categoriaSelecionada + ":");
      nova = (nova||"").trim();
      if(!nova) return;
      if(lista.indexOf(nova) === -1){
        lista.push(nova);
        salvarCategorias();
      }
      state.subcategoriaSelecionada = nova;
      renderSubChips();
    });
    wrap.appendChild(addChip);
  }

  function salvarCategorias(){
    if(!state.db) return;
    state.db.doc("config/categorias").set({
      despesa: state.categorias.despesa,
      receita: state.categorias.receita
    }).catch(function(){});
  }

  // ---- Default date = today ----
  $('#data').value = isoDate(new Date());

  // ---- Submit entry ----
  $('#entry').addEventListener('submit', function(ev){
    ev.preventDefault();
    if(!state.db) return;
    var valor = parseFloat($('#valor').value);
    if(!valor || valor <= 0){ $('#valor').focus(); return; }
    if(!state.categoriaSelecionada){
      state.categoriaSelecionada = categoriasDoTipo()[0] || "Outros";
    }
    if(state.tipo === 'despesa' && !state.subcategoriaSelecionada){
      state.subcategoriaSelecionada = (state.categorias.despesa[state.categoriaSelecionada]||[])[0] || "";
    }
    var doc = {
      tipo: state.tipo,
      valor: Math.round(valor * 100) / 100,
      categoria: state.categoriaSelecionada,
      subcategoria: state.tipo === 'despesa' ? (state.subcategoriaSelecionada||"") : "",
      metodo: $('#metodo').value,
      data: $('#data').value || isoDate(new Date()),
      descricao: $('#descricao').value.trim(),
      origem: "manual",
      criado_em: new Date().toISOString()
    };
    var btn = $('#btnSalvar');
    btn.disabled = true; btn.textContent = "Salvando…";
    state.db.collection("transacoes").add(doc).then(function(){
      $('#valor').value = "";
      $('#descricao').value = "";
      $('#valor').focus();
    }).catch(function(err){
      alert("Não consegui salvar: " + (err && err.message ? err.message : "erro desconhecido"));
    }).then(function(){
      btn.disabled = false; btn.textContent = "Salvar lançamento";
    });
  });

  // ---- Render recent list ----
  function renderRecentes(){
    var wrap = $('#listaRecentes');
    wrap.innerHTML = "";
    if(!state.transacoes.length){
      wrap.innerHTML = '<div class="empty">Nenhum lançamento ainda. Registre o primeiro acima.</div>';
      return;
    }
    var porDia = {};
    var ordem = [];
    state.transacoes.slice(0, 60).forEach(function(t){
      if(!porDia[t.data]){ porDia[t.data] = []; ordem.push(t.data); }
      porDia[t.data].push(t);
    });
    var hoje = isoDate(new Date());
    var ontem = isoDate(new Date(Date.now() - 86400000));
    ordem.forEach(function(dia){
      var group = document.createElement('div');
      var label = dia === hoje ? "Hoje" : dia === ontem ? "Ontem" :
        new Date(dia + "T00:00:00").toLocaleDateString('pt-BR', {day:'2-digit', month:'short'});
      group.innerHTML = '<div class="day-label">' + label + '</div>';
      var list = document.createElement('div');
      list.className = "day-group";
      porDia[dia].forEach(function(t){
        var row = document.createElement('div');
        row.className = "txn";
        row.innerHTML =
          '<span class="cat-dot ' + t.tipo + '"></span>' +
          '<div class="info">' +
            '<div class="desc">' + escapeHtml(t.descricao || t.categoria) + '</div>' +
            '<div class="meta">' + escapeHtml(t.categoria + (t.subcategoria ? ' · ' + t.subcategoria : '')) + ' · ' + (METODO_LABEL[t.metodo]||t.metodo) + '</div>' +
          '</div>' +
          '<div class="amt ' + t.tipo + ' num">' + (t.tipo === 'despesa' ? '-' : '+') + fmtBRL(t.valor) + '</div>' +
          '<button class="del" title="Excluir" data-id="' + t.id + '">×</button>';
        list.appendChild(row);
      });
      group.appendChild(list);
      wrap.appendChild(group);
    });
    $all('.del', wrap).forEach(function(btn){
      btn.addEventListener('click', function(){
        if(!state.db) return;
        if(!confirm("Excluir este lançamento?")) return;
        state.db.collection("transacoes").doc(btn.dataset.id).delete().catch(function(){});
      });
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ---- Resumo tab ----
  function mesesDisponiveis(){
    var set = {};
    state.transacoes.forEach(function(t){ set[t.data.slice(0,7)] = true; });
    set[isoMonth(new Date())] = true;
    return Object.keys(set).sort();
  }

  function renderMesChips(){
    var meses = mesesDisponiveis();
    if(meses.indexOf(state.mesAtual) === -1){ state.mesAtual = meses[meses.length - 1]; }
    var wrap = $('#mesSelect');
    wrap.innerHTML = "";
    meses.forEach(function(m){
      var chip = document.createElement('button');
      chip.type = "button";
      chip.className = "month-chip" + (m === state.mesAtual ? " active" : "");
      chip.textContent = monthLabelShort(m);
      chip.addEventListener('click', function(){
        state.mesAtual = m;
        renderResumo();
      });
      wrap.appendChild(chip);
    });
  }

  function renderResumo(){
    renderMesChips();

    var doMes = state.transacoes.filter(function(t){ return t.data.slice(0,7) === state.mesAtual; });
    var receitas = 0, despesas = 0;
    var porCategoria = {};
    doMes.forEach(function(t){
      if(t.tipo === 'receita'){ receitas += t.valor; }
      else {
        despesas += t.valor;
        porCategoria[t.categoria] = (porCategoria[t.categoria]||0) + t.valor;
      }
    });
    var saldo = receitas - despesas;

    $('#statReceitas').textContent = fmtBRL(receitas);
    $('#statDespesas').textContent = fmtBRL(despesas);
    $('#statSaldo').textContent = fmtBRL(saldo);

    if(state.mesAtual === isoMonth(new Date())){
      $('#saldoMesTag').textContent = fmtBRL(saldo);
    }

    var bars = Object.keys(porCategoria).map(function(k){ return {cat:k, val:porCategoria[k]}; })
      .sort(function(a,b){ return b.val - a.val; });
    var max = bars.length ? bars[0].val : 0;
    var barlist = $('#barlist');
    barlist.innerHTML = "";
    if(!bars.length){
      barlist.innerHTML = '<div class="empty">Sem despesas registradas neste mês.</div>';
    } else {
      bars.forEach(function(b){
        var row = document.createElement('div');
        row.className = "barrow";
        var pct = max ? Math.round((b.val/max)*100) : 0;
        row.innerHTML =
          '<div class="top"><span class="cat">' + escapeHtml(b.cat) + '</span><span class="val num">' + fmtBRL(b.val) + '</span></div>' +
          '<div class="bartrack"><div class="barfill" style="width:' + pct + '%"></div></div>';
        barlist.appendChild(row);
      });
    }

    var analiseWrap = $('#analisesLista');
    var analise = state.resumos.filter(function(r){ return r.id === state.mesAtual; })[0];
    analiseWrap.innerHTML = "";
    if(!analise){
      analiseWrap.innerHTML = '<div class="empty">Sem análise de extrato para este mês ainda. Envie o PDF/CSV do cartão e do Pix numa conversa para gerar aqui.</div>';
    } else {
      var d = analise.data || {};
      var div = document.createElement('div');
      div.className = "analise";
      var destaquesHtml = (d.destaques||[]).map(function(x){ return '<li>' + escapeHtml(x) + '</li>'; }).join('');
      var divergenciasHtml = (d.divergencias||[]).map(function(x){ return '<li class="divergencia">' + escapeHtml(x) + '</li>'; }).join('');
      div.innerHTML =
        '<div class="head"><b>Análise do extrato</b><span>' + (d.gerado_em ? new Date(d.gerado_em).toLocaleDateString('pt-BR') : '') + '</span></div>' +
        (destaquesHtml ? '<ul>' + destaquesHtml + '</ul>' : '') +
        (divergenciasHtml ? '<ul>' + divergenciasHtml + '</ul>' : '');
      analiseWrap.appendChild(div);
    }
  }

  // ---- Boot ----
  async function boot(){
    var db = null;
    try { db = await claude.use("db"); } catch(e){ db = null; }
    if(!db){
      $('#offlineBanner').style.display = "block";
      $('#btnSalvar').disabled = true;
      renderChips();
      return;
    }
    state.db = db;

    var cfgSnap = await db.doc("config/categorias").get().catch(function(){ return null; });
    if(cfgSnap && cfgSnap.exists){
      var data = cfgSnap.data();
      state.categorias.despesa = (data.despesa && typeof data.despesa === 'object' && !Array.isArray(data.despesa)) ? data.despesa : DEFAULT_CATEGORIAS.despesa;
      state.categorias.receita = data.receita || DEFAULT_CATEGORIAS.receita;
    } else {
      db.doc("config/categorias").set({despesa: DEFAULT_CATEGORIAS.despesa, receita: DEFAULT_CATEGORIAS.receita}).catch(function(){});
    }
    renderChips();

    function mostrarErroSync(origem, err){
      var banner = $('#syncBanner');
      banner.textContent = "Não consegui atualizar (" + origem + "): " + (err && err.message ? err.message : "erro desconhecido") + " — tente recarregar a página.";
      banner.style.display = "block";
    }

    db.collection("transacoes").orderBy("data", "desc").limit(1000).onSnapshot(function(snap){
      $('#syncBanner').style.display = "none";
      state.transacoes = snap.docs.map(function(d){
        var v = d.data();
        v.id = d.id;
        return v;
      }).sort(function(a,b){
        if(a.data !== b.data) return a.data < b.data ? 1 : -1;
        return (b.criado_em||"").localeCompare(a.criado_em||"");
      });
      renderRecentes();
      renderResumo();
    }, function(err){ mostrarErroSync("lançamentos", err); });

    db.collection("resumos").orderBy("mes", "desc").limit(24).onSnapshot(function(snap){
      state.resumos = snap.docs.map(function(d){ return {id: d.id, data: d.data()}; });
      renderResumo();
    }, function(err){ mostrarErroSync("análises mensais", err); });
  }

  boot();
})();
</script>
